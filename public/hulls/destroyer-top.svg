    <line x1="106" y1="800" x2="110" y2="830" stroke="#50c878" stroke-width="1.2" opacity="0.45"/>
    <ellipse cx="89" cy="832" rx="5" ry="3" fill="none" stroke="#50c878" stroke-width="1" opacity="0.45"/>
    <ellipse cx="111" cy="832" rx="5" ry="3" fill="none" stroke="#50c878" stroke-width="1" opacity="0.45"/>
