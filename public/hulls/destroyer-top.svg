    <ellipse cx="93" cy="736" rx="2.5" ry="2" fill="none" stroke="#50c878" stroke-width="0.5" opacity="0.4"/>
    <ellipse cx="97" cy="736" rx="2.5" ry="2" fill="none" stroke="#50c878" stroke-width="0.5" opacity="0.4"/>
    <ellipse cx="101" cy="736" rx="2.5" ry="2" fill="none" stroke="#50c878" stroke-width="0.5" opacity="0.4"/>
    <ellipse cx="105" cy="736" rx="2.5" ry="2" fill="none" stroke="#50c878" stroke-width="0.5" opacity="0.4"/>
    <ellipse cx="109" cy="736" rx="2.5" ry="2" fill="none" stroke="#50c878" stroke-width="0.5" opacity="0.4"/>
