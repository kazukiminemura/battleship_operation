    <line x1="97" y1="649" x2="97" y2="665" stroke="#7eeaa0" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="103" y1="649" x2="103" y2="665" stroke="#7eeaa0" stroke-width="2.2" stroke-linecap="round"/>
