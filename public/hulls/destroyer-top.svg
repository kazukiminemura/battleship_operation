    <line x1="110" y1="458" x2="138" y2="458" stroke="#50c878" stroke-width="0.4" opacity="0.35"/>
    <line x1="110" y1="462" x2="138" y2="462" stroke="#50c878" stroke-width="0.4" opacity="0.35"/>
